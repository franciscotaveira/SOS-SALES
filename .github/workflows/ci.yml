name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install frontend dependencies from lockfile
        run: bun run web:install
      - name: Typecheck and build frontend
        run: bun run check:web

  api:
    name: API (Node)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies from lockfile
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase test stack
        run: supabase start
      - name: Wait for test database
        run: npm run db:wait
      - name: Typecheck, test and build API
        run: npm run check && npm run build

  ai-security:
    name: AI Security Gate
    runs-on: ubuntu-latest
    # Only run when AI-related files change or on manual dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ai-gate]') ||
      contains(github.event.head_commit.modified, 'humanizer-kernel') ||
      contains(github.event.head_commit.modified, 'receptionist') ||
      contains(github.event.head_commit.modified, 'nvidia-nim')
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run AI Security Gate (10 essential tests)
        run: node scripts/test-ai-security-gate.mjs
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report
          path: ai-security-report.json
          retention-days: 90
