server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router routes such as /settings and /cockpit are handled by the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must be revalidated so deployments are visible immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
