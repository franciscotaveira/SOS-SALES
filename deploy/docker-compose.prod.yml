name: sos-sales

services:
  caddy:
    image: caddy:2-alpine
    container_name: sos-sales-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/sos-sales/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/web/dist:/var/www/html:ro
      - /opt/sos-sales/landing:/var/www/landing:ro
      - /opt/sos-sales/caddy_data:/data
      - /opt/sos-sales/caddy_config:/config
    networks:
      - sos-network
    depends_on:
      - sos-sales-api

  sos-sales-api:
    image: node:20-alpine
    container_name: sos-sales-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "dist/index.js"]
    volumes:
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/api/dist:/app/dist:ro
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/api/node_modules:/app/node_modules:ro
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/api/package.json:/app/package.json:ro
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/api/production-runtime.mjs:/app/production-runtime.mjs:ro
      - ${SOS_SALES_RELEASE_ROOT:-/opt/sos-sales/current}/certs/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    env_file:
      - ${SOS_SALES_ENV_FILE:-/opt/sos-sales/.env.production}
    environment:
      - APP_ENV=production
      - NODE_ENV=production
      - PORT=4334
      - HOST=0.0.0.0
      - SOS_SALES_RUNTIME_FACTORY=/app/production-runtime.mjs
      - DATABASE_SSL_CA_FILE=/run/secrets/supabase-ca.crt
    networks:
      - sos-network
    depends_on:
      sos-sales-redis:
        condition: service_healthy

  sos-sales-redis:
    image: redis:7-alpine
    container_name: sos-sales-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /opt/sos-sales/redis_data:/data
    networks:
      - sos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sos-sales-waha:
    image: devlikeapro/waha:latest
    container_name: sos-sales-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_DASHBOARD_ENABLED: "true"
      WHATSAPP_SWAGGER_ENABLED: "true"
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_LOG_FORMAT: JSON
      TZ: America/Sao_Paulo
      # Webhook ACK timeout: aumentado de 5s (padrão) para 15s
      # evita reenvios duplicados enquanto a API processa o evento
      WHATSAPP_HOOK_TIMEOUT: "15000"
    volumes:
      - /opt/sos-sales/waha_sessions:/app/.sessions
      - /opt/sos-sales/waha_media:/app/.media
    networks:
      - sos-network
    shm_size: 1gb

networks:
  sos-network:
    name: sos-sales-network
    driver: bridge
