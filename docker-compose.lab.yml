services:
  # ---------------------------------------------------------------------------
  # FRONTEND SPA LAB / TEST (PORT 3333)
  # ---------------------------------------------------------------------------
  web-lab:
    build:
      context: .
      dockerfile: Dockerfile.lab.web
      args:
        VITE_SOS_API_URL: /api/v1
        VITE_SUPABASE_URL: ${LAB_SUPABASE_URL:-http://localhost:55431}
        VITE_SUPABASE_ANON_KEY: ${LAB_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
    container_name: sos-sales-lab-web
    restart: unless-stopped
    ports:
      - "3333:80"
    depends_on:
      - api-lab
    networks:
      - sos-lab-network

  # ---------------------------------------------------------------------------
  # API BACKEND LAB (PORT 4335)
  # Conecta ao Supabase Local Completo (PostgreSQL + Auth + JWKS + RLS na porta 55432 / 55431)
  # ---------------------------------------------------------------------------
  api-lab:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_ENV: lab
    container_name: sos-sales-lab-api
    restart: unless-stopped
    ports:
      - "4335:4334"
    environment:
      - NODE_ENV=development
      - APP_ENV=lab
      - PORT=4334
      - HOST=0.0.0.0
      - PUBLIC_API_URL=http://api-lab:4334
      - LAB_DATABASE_URL=${LAB_DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - DATABASE_SSL=false
      - LAB_SUPABASE_URL=${LAB_SUPABASE_URL:-http://kong:8000}
      - LAB_SUPABASE_ANON_KEY=${LAB_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - LAB_SUPABASE_JWKS_URL=${LAB_SUPABASE_JWKS_URL:-http://auth:9999/.well-known/jwks.json}
      - LAB_SUPABASE_JWT_ISSUER=${LAB_SUPABASE_JWT_ISSUER:-http://127.0.0.1:55431/auth/v1}
      - REDIS_URL=redis://redis-lab:6379
      - WAHA_BASE_URL=http://waha-lab:3000
      - WAHA_API_KEY=${LAB_WAHA_API_KEY:-mct_sos_waha_lab_secret_2026}
      - META_VERIFY_TOKEN=${LAB_META_VERIFY_TOKEN:-lab_verify_token_stub}
      - META_APP_SECRET=${LAB_META_APP_SECRET:-lab_app_secret_stub_32chars_min}
      - CAKTO_CLIENT_ID=${LAB_CAKTO_CLIENT_ID:-}
      - CAKTO_CLIENT_SECRET=${LAB_CAKTO_CLIENT_SECRET:-}
      - CAKTO_WEBHOOK_SECRET=${LAB_CAKTO_WEBHOOK_SECRET:-lab_cakto_webhook_secret_not_for_production}
      - CAKTO_PAST_DUE_GRACE_DAYS=${LAB_CAKTO_PAST_DUE_GRACE_DAYS:-7}
      - BILLING_ENFORCEMENT_MODE=${LAB_BILLING_ENFORCEMENT_MODE:-observe}
    depends_on:
      redis-lab:
        condition: service_healthy
    networks:
      sos-lab-network:
        aliases:
          - api-lab
          - sos-sales-api
          - sos-sales-lab-api
      supabase-lab-network: {}

  # ---------------------------------------------------------------------------
  # REDIS LAB
  # ---------------------------------------------------------------------------
  redis-lab:
    image: redis:7.2-alpine
    container_name: sos-sales-lab-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - sos-lab-network

  # ---------------------------------------------------------------------------
  # WAHA WHATSAPP ENGINE LAB
  # ---------------------------------------------------------------------------
  waha-lab:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: sos-sales-lab-waha
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - WAHA_API_KEY=${LAB_WAHA_API_KEY:-mct_sos_waha_lab_secret_2026}
      - WHATSAPP_HOOK_URL=http://api-lab:4334/api/v1/channels/waha/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_HOOK_CUSTOM_HEADERS=x-api-key:mct_sos_waha_lab_secret_2026
      - WAHA_WEBHOOK_URL=http://api-lab:4334/api/v1/channels/waha/webhook
      - WAHA_WEBHOOK_EVENTS=message,message.any,session.status
      - WAHA_WEBHOOK_CUSTOM_HEADERS=x-api-key:mct_sos_waha_lab_secret_2026
      - WAHA_WORKER_CONCURRENCY=5
      - WAHA_ZIP_LOGS=false
    networks:
      - sos-lab-network

networks:
  sos-lab-network:
    driver: bridge
  supabase-lab-network:
    external: true
    name: ${LAB_SUPABASE_DOCKER_NETWORK:-supabase_network_sos-sales}
