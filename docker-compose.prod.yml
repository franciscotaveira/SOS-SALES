services:
  # ---------------------------------------------------------------------------
  # REVERSE PROXY & AUTOMATIC TLS (CADDY)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: sos-sales-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - sos-network

  # ---------------------------------------------------------------------------
  # FRONTEND SPA (VITE + NGINX)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SOS_API_URL: /api/v1
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: sos-sales-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - sos-network

  # ---------------------------------------------------------------------------
  # API BACKEND (FASTIFY + TX COMMERCIAL CORE)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sos-sales-api
    restart: unless-stopped
    env_file:
      - ${SOS_SALES_ENV_FILE:-.env.production}
    expose:
      - "4334"
    environment:
      - NODE_ENV=production
      - PORT=4334
      - HOST=0.0.0.0
      - SOS_SALES_RUNTIME_FACTORY=/app/deploy/production-runtime.mjs
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
      - DATABASE_SSL_CA_FILE=/run/secrets/supabase-ca.crt
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - WAHA_BASE_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:?META_VERIFY_TOKEN is required}
      - META_APP_SECRET=${META_APP_SECRET:?META_APP_SECRET is required}
    volumes:
      - ./deploy/production-runtime.mjs:/app/deploy/production-runtime.mjs:ro
      - ./certs/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sos-network

  # ---------------------------------------------------------------------------
  # REDIS (PRIVATE QUEUE & CACHE)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: sos-sales-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sos-network

  # ---------------------------------------------------------------------------
  # WAHA WHATSAPP ENGINE (PRIVATE CONTAINER)
  # ---------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: sos-sales-waha
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      # The durable supplier endpoint validates the API key and persists the
      # inbound event before workers process it. Keep the connection id/session
      # resolution on the server instead of pointing WAHA at the strict HMAC
      # route, which requires a per-connection URL that WAHA cannot infer.
      - WHATSAPP_HOOK_URL=http://api:4334/api/v1/channels/waha/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_HOOK_CUSTOM_HEADERS=x-api-key:${WAHA_API_KEY}
      - WAHA_WEBHOOK_URL=http://api:4334/api/v1/channels/waha/webhook
      - WAHA_WEBHOOK_EVENTS=message,message.any,session.status
      - WAHA_WEBHOOK_CUSTOM_HEADERS=x-api-key:${WAHA_API_KEY}
      - WAHA_WORKER_CONCURRENCY=5
      - WAHA_ZIP_LOGS=false
    volumes:
      - waha_data:/app/.sessions
    networks:
      - sos-network

networks:
  sos-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  waha_data:
