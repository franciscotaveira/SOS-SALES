<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="50%" stop-color="#00A884" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbol Icon Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Outer Pulse Halo -->
  <circle cx="32" cy="32" r="22" fill="#00A884" fill-opacity="0.08" />

  <!-- Continuity Geometric S Path -->
  <path d="M42 19H25C21.134 19 18 22.134 18 26V28C18 31.866 21.134 35 25 35H39C42.866 35 46 38.134 46 42V44C46 47.866 42.866 51 39 51H22" stroke="url(#neonPulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)" />
  
  <!-- Center Signal Pulse Ray -->
  <path d="M14 35L25 35L29 23L35 47L39 35L50 35" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="29" cy="23" r="2.2" fill="#38BDF8" />
  <circle cx="35" cy="47" r="2.2" fill="#00F59B" />

  <!-- Wordmark Text -->
  <text x="76" y="36" font-family="'Plus Jakarta Sans', 'Sora', 'Inter', system-ui, sans-serif" font-size="24" font-weight="900" fill="#0F172A" letter-spacing="-0.035em">SOS VENDAS</text>
  <text x="76" y="52" font-family="'Inter', 'Source Sans 3', system-ui, sans-serif" font-size="10" font-weight="800" fill="#00A884" letter-spacing="0.16em">SISTEMA OPERACIONAL</text>
</svg>
